  frozen_config: configs/disease_side_v3.2_frozen.yaml

analysis:
  expression_transform: log2_TPM_plus_1
  module_score: mean_gene_score_then_global_standardization
  independent_unit: D2 biological replicate; human cohort-region stratum for context only
  alpha: 0.05
  correction: Benjamini-Hochberg across all D2 G4 module-by-time tests
  minimum_modalities: 2
  minimum_positive_iron_timepoints: 2
  minimum_positive_lpo_timepoints: 1
  minimum_positive_ferro_aging_timepoints: 2

external_evidence:
  - evidence_id: Kenkhuis_2021_direct_iron_microglia
