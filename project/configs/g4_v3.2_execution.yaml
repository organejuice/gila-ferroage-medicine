    doi: 10.1186/s40478-021-01126-5
    pmid: 33597025
    source_url: https://pubmed.ncbi.nlm.nih.gov/33597025/
    supplementary_url: https://doi.org/10.6084/m9.figshare.14053524
    supplementary_file: 40478_2021_1126_MOESM1_ESM.pdf
    supplementary_expected_md5: 7b4798ab8559dc2ddb4b3c6fa58bef5c
    modality: direct_iron_histology_and_microscopy
    context: human_AD_microglia
    sample_design: 12_AD_and_9_control; iron_positive_analysis_11_AD_and_9_control
    assays: Perls_iron_stain; FTL_Iba1_TMEM119_P2RY12_multispectral_IF; T2star_MRI
    result: increased_iron_positive_cells_and_FTL_positive_microglia_in_AD
    evidence_tier: C_publication_level_direct_measure
    counts_as_second_modality: true
    local_quantitative_reanalysis: false
