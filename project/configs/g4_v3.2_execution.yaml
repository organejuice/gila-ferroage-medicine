run_id: 2026-09-20-disease-side-v3.2-g4
protocol: docs/protocol/disease_side_v3.2_latest_frozen.md
superseded_run: results/2026-09-20-disease-side-v3.2-g3-model-scoped

inputs:
  g3_decision: results/2026-09-20-disease-side-v3.2-g3-model-scoped/g3_decision.json
  d2_gene_tpm: results/archive/2026-09-20-pre-v3-freeze/results/tables/D2_gene_tpm.tsv
  d2_sample_metadata: results/archive/2026-09-20-pre-v3-freeze/results/tables/D2_sample_metadata.tsv
