    - M5_Iron_Uptake
    - M5_Iron_Storage
    - M5_Iron_Export
    - M5_Ferritinophagy
    - M6_LPO_ACSL4
    - M7_FerroAging_Author
  gate:
    all_primary_cohorts_estimable: true
    minimum_concordant_cohorts: 2
    random_effects_meta_fdr_max: 0.05
    leave_one_cohort_out_direction_stable: true
    sensitivity_cohort_can_rescue_failure: false
