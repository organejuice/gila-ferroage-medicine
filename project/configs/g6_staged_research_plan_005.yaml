work_packages:
  - id: WP1
    name: HHSTA_metadata_and_design_identifiability
    expression_data_access: false
    required_outputs:
      - donor_sample_crosswalk
      - per_subregion_independent_donor_counts
      - diagnosis_technical_factor_common_support
      - design_matrix_rank_audit
      - reference_donor_independence_audit
    stop_states:
      - HOLD_METADATA
      - STOP_NONIDENTIFIABLE
  - id: WP2
    name: CellBin_expression_identity_signature_and_geometry
    starts_only_if: WP1_PASS
    effect_blind: true
    required_audits:
      - assay_count_layer_and_gene_id
      - barcode_segmentation_coordinate_crosswalk
      - segmentation_quality_and_tissue_mask
      - independent_microglia_astrocyte_identity
      - frozen_G1_G5_detection_and_partial_score_fidelity
      - physical_neighborhood_feasibility
    numeric_thresholds:
      status: PENDING_BLIND_CALIBRATION
      may_import_legacy_spatial_cutoffs_without_validation: false
    stop_states:
      - NOT_ELIGIBLE
      - IDENTITY_NOT_CALIBRATED
      - SIGNATURE_NOT_ESTIMABLE
      - GEOMETRY_NOT_AUDITABLE
  - id: WP3
    name: independent_cohort_metadata_and_role_screen
    large_matrix_download: false
    ROSMAP_role: cross_region_auxiliary_only
    same_region_independent_validation_required_for_G6_PASS: true

