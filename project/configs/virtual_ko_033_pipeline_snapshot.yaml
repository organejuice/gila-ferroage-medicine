      - network_n_comp
      - network_q
      - td_K
      - td_max_iter
      - td_max_error
      - td_n_decimal
      - ma_n_dim
      - ncores
      - accelerated_pcnet
      - sparse_cp
      - implicit_manifold
      - targets_microglia
      - targets_astrocyte
      - states
      - target_retention_min_cells
      - only_newly_eligible_targets
